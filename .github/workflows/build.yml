name: Costruzione programma
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove automatiche
        run: python -m unittest discover -s tests -v
      - name: Costruzione del programma
        run: |
          pip install pyinstaller
          pyinstaller --onefile --noconsole --name Simapex avvia.py
      - name: Pubblicazione
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(python -c "from simapex.versione import VERSIONE; print(VERSIONE)")
          gh release create "v$V" dist/Simapex.exe --title "Simapex $V" --notes "Versione $V" --latest || gh release upload "v$V" dist/Simapex.exe --clobber
