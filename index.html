/* Simapex - Colori e dimensioni sono tutti qui sotto, in :root. */

}
@media (prefers-color-scheme: light){

    --bg:#f3f4f6; --surface:#ffffff; --surface2:#eceef2; --line:#cfd4dc; --fg:#171a1f; --muted:#566070;

}

<div class="wrap">
  <div class="top"><h1>Simapex</h1><span style="display:flex;align-items:center;gap:10px"><span class="ver" id="ver"></span><button class="ed" data-act="menu" aria-label="Menu" style="min-height:40px;min-width:44px;padding:0 12px;font-size:20px;line-height:1">⋯</button></span></div>
  <div id="notice"></div>
  <main id="main"></main>
</div>
<nav aria-label="Sezioni">
  <button class="tab" data-tab="home">Consulta</button>
  <button class="tab" data-tab="backup">Backup</button>
</nav>
<div id="layer"></div>

<script>
'use strict';
/* ===================================================================
   SIMAPEX - un solo file. Ordine: strumenti, archivio (IndexedDB), backup,
   selezione, mappa, schermata Consulta, editor, strategia, Dati, Backup,
   eventi, avvio.
   =================================================================== */

const APP_V = '0.21.3';   // versione dell'app
const DATA_V = 3;      // versione del formato dei dati
const DEFAULT_QUICK = ['Cartello 150', 'Cartello 100', 'Cartello 50', 'Fine cordolo'];
// Quando il formato dei dati cambia: aumenta DATA_V e aggiungi qui la funzione che porta
// i dati vecchi al formato nuovo. MIGRATIONS[1] porta i dati dalla versione 1 alla 2.
const MIGRATIONS = {
  1: db => {
    db.brakes = db.brakes || {}; db.pits = db.pits || {}; db.perf = db.perf || {};
    db.setupGen = db.setupGen || {}; db.setupSpec = db.setupSpec || {}; db.notes = db.notes || [];
    db.settings.quick = db.settings.quick || DEFAULT_QUICK.map(l => ({id: uid(), label: l}));
  },
  // 2 -> 3: i giochi diventano un elenco; ogni gruppo sta in un gioco, ogni variante dice in quali giochi esiste
  2: db => {
    const names = [...new Set(db.groups.map(g => (g.game || '').trim()).filter(Boolean))];
    if (!names.length) names.push('ACC');
    db.games = names.map(n => ({id: uid(), name: n}));
    db.groups.forEach(g => { const m = db.games.find(x => x.name === (g.game || '').trim()) || db.games[0]; g.gameId = m.id; delete g.game; });
    db.variants.forEach(v => { v.games = db.games.map(x => x.id); });
  }
};

/* ---------- Strumenti ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();
const clone = o => JSON.parse(JSON.stringify(o));
const kk = (...a) => a.join('|');
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const fdt = iso => {
  if (!iso) return 'mai';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'});
};
const today = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); };
const fd = iso => { if (!iso) return ''; if (iso.slice(0, 10) === today()) return 'oggi'; const p = iso.slice(0, 10).split('-'); return (+p[2]) + ' ' + MESI[+p[1] - 1]; };
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));

let DB = null;                 // tutti i dati dell'utente
const UI = {tab:'home'};       // stato dello schermo (non viene salvato)
let C = null, V = null, G = null, A = null, GAME = null;   // circuito, variante, gruppo e auto selezionati

function toast(t) {
  const e = document.createElement('div');
  e.className = 'toast'; e.textContent = t; e.setAttribute('role', 'status');
  document.body.appendChild(e);
  setTimeout(() => e.remove(), 2600);
}

/* ---------- Archivio: IndexedDB ---------- */
let idb = null, memOnly = false;

function openArchive() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('simapex', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('copies', {keyPath:'id', autoIncrement:true}); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

function openSetup(cond, mode) {
  if (!needCtx('av')) return;
  const cname = cond === 'dry' ? 'asciutto' : 'bagnato', sub = carNameFull();
  if (!carSections().length) return sheet('Setup ' + cname, '<div class="empty">Il gruppo ' + esc(G.name) + ' non ha ancora i parametri del setup. Aggiungili con ✎ vicino a Gruppo auto.</div>', sub);
  const gen = (DB.setupGen[A.id] || {})[cond], sp = (DB.setupSpec[kk(A.id, V.id)] || {})[cond];
  if (!gen && !sp) {
    return sheet('Setup ' + cname, `<div class="empty">Nessun setup ${cname} inserito per questa auto.</div>
      <div class="btns" style="justify-content:center"><button class="pri" data-act="setupedit" data-cond="${cond}" data-scope="gen">Inserisci il setup generale</button></div>`, sub);
  }
  mode = mode || (sp ? 'spec' : 'gen');
  const baseGen = gen ? gen.vals : ((DB.setupGen[A.id] || {}).dry || {vals: {}}).vals;
  let html = '';
  if (sp) html += `<div class="seg"><button class="sec2" data-act="setupmode" data-cond="${cond}" data-mode="spec" aria-pressed="${mode === 'spec'}">Specifico</button><button class="sec2" data-act="setupmode" data-cond="${cond}" data-mode="gen" aria-pressed="${mode === 'gen'}">Generale</button></div>`;
  else html += '<p class="meta">Nessun setup specifico per questa variante: mostro il generale.</p>';
  let total = 0, bar = '', body = '';
  const tile = (p, ch, val, g) => `<div class="tl${ch ? ' ch' : ''}" data-act="parinfo" data-l="${esc(p.label)}"><span class="k">${esc(p.label)}</span><span class="v">${esc(val == null ? '—' : val)}</span>${ch ? `<span class="was">generale ${esc(g == null ? '—' : g)}</span>` : ''}</div>`;
  carSections().forEach((sec, i) => {
    let cnt = 0;
    const grid = list => '<div class="tg">' + list.map(p => {
      const g = baseGen[p.id], ch = mode === 'spec' && sp && sp.vals[p.id] != null && sp.vals[p.id] !== g;
      if (ch) cnt++;
      return tile(p, ch, ch ? sp.vals[p.id] : g, g);
    }).join('') + '</div>';
    let inner = sec.params.length ? grid(sec.params) : '';
    (sec.subs || []).forEach(b => { inner += `<div class="tsub">${esc(b.name)}</div>` + grid(b.params); });
    total += cnt;
    bar += `<button data-act="secjump" data-i="${i}">${esc(sec.name)}${cnt ? `<b>${cnt}</b>` : ''}</button>`;
    body += `<div class="sgh" id="sec${i}"><span>${esc(sec.name)}</span>${cnt ? `<span class="scn">${cnt}${cnt === 1 ? ' modifica' : ' modifiche'}</span>` : ''}</div>${inner}`;
  });
  html += `<div class="sbar">${bar}</div>` + body;
  const d = mode === 'spec' && sp ? sp.u : gen && gen.u;
  html += `<p class="meta">Modificato ${fd(d)}${mode === 'spec' ? ' · ' + total + ' valori diversi dal generale' : ''}</p>
    <div class="btns"><button class="sec2" data-act="setupedit" data-cond="${cond}" data-scope="gen">Modifica generale</button><button class="sec2" data-act="setupedit" data-cond="${cond}" data-scope="spec">${sp ? 'Modifica specifico' : 'Crea specifico'}</button><button class="sec2" data-act="setupstruct" data-cond="${cond}">Modifica parametri</button><button class="sec2" data-act="carparams" data-cond="${cond}">Solo per questa auto</button><button class="sec2" data-act="guide">📖 Guida al setup</button></div>`;
  sheet('Setup ' + cname, html, sub);
}
function editSetup(cond, scope) {
  const gen = (DB.setupGen[A.id] || {})[cond], sp = (DB.setupSpec[kk(A.id, V.id)] || {})[cond];
  const dryGen = ((DB.setupGen[A.id] || {}).dry || {vals: {}}).vals;
  const base = gen ? gen.vals : (scope === 'spec' ? dryGen : {});
  const vals = scope === 'gen' ? (gen ? gen.vals : {}) : (sp ? sp.vals : {});
  UI.sh = {cond, scope, base};
  const cname = cond === 'dry' ? 'asciutto' : 'bagnato';
  let html = scope === 'gen'
    ? '<p class="meta">Compila tutti i valori del setup generale di questa auto.</p>'
    : '<p class="meta">Scrivi solo i valori diversi dal generale. I campi vuoti usano il valore generale, mostrato in grigio.</p>';
  if (scope === 'gen' && cond === 'wet' && dryGen && Object.keys(dryGen).length) html += '<div class="btns" style="margin:0 0 10px"><button class="sec2" data-act="setupcopy">Parti dall\'asciutto</button></div>';
  let bar = '', body = '';
  carSections().forEach((sec, i) => {
    const inp = (p, pre) => `<label class="tl"><span class="k">${esc(p.label)}<span class="ii" data-act="parinfo" data-l="${esc(p.label)}" role="button" aria-label="Cosa fa">ⓘ</span></span><input data-pid="${p.id}" value="${esc(vals[p.id] == null ? '' : vals[p.id])}" placeholder="${scope === 'spec' ? esc(base[p.id] == null ? '' : base[p.id]) : ''}" aria-label="${esc((pre ? pre + ' ' : '') + p.label)}"></label>`;
    bar += `<button data-act="secjump" data-i="${i}">${esc(sec.name)}</button>`;
    body += `<div class="sgh" id="sec${i}"><span>${esc(sec.name)}</span></div>` + (sec.params.length ? '<div class="tg">' + sec.params.map(p => inp(p)).join('') + '</div>' : '') + (sec.subs || []).map(b => `<div class="tsub">${esc(b.name)}</div><div class="tg">` + b.params.map(p => inp(p, b.name)).join('') + '</div>').join('');
  });
  html += `<div class="sbar">${bar}</div>` + body;
  html += `<div class="btns" style="margin-top:12px"><button class="pri" data-act="setupsave">Salva</button><button class="sec2" data-act="setupback">Annulla</button><button class="sec2" data-act="setupstruct" data-cond="${cond}" data-scope="${scope}">Modifica parametri</button><button class="sec2" data-act="guide">📖 Guida</button></div>`;
  sheet((scope === 'gen' ? 'Setup generale ' : 'Setup specifico ') + cname, html, carNameFull());
}
function setupBack(r) { if (r.scope && (DB.setupGen[A.id] || DB.setupSpec[kk(A.id, V.id)])) return editSetup(r.cond, r.scope); openSetup(r.cond); }
function applySetupInputs() {   // scrive i campi della finestra nel setup, senza toccare i valori dei parametri nascosti a questa auto
  const {cond, scope, base} = UI.sh, key = kk(A.id, V.id);
  const cur = scope === 'gen' ? (DB.setupGen[A.id] || {})[cond] : (DB.setupSpec[key] || {})[cond];
  const out = Object.assign({}, cur ? cur.vals : {});
  document.querySelectorAll('.sheet input[data-pid]').forEach(i => {
    const v = i.value.trim(), pid = i.dataset.pid;
    if (!v || (scope === 'spec' && base[pid] === v)) delete out[pid]; else out[pid] = v;
  });
  if (scope === 'gen') {
    if (!Object.keys(out).length) return false;
    (DB.setupGen[A.id] = DB.setupGen[A.id] || {})[cond] = {vals: out, u: now()};
  } else if (Object.keys(out).length) (DB.setupSpec[key] = DB.setupSpec[key] || {})[cond] = {vals: out, u: now()};
  else if (DB.setupSpec[key]) { delete DB.setupSpec[key][cond]; if (!Object.keys(DB.setupSpec[key]).length) delete DB.setupSpec[key]; }
  save(); return true;
}
function saveSetup() {
  const cond = UI.sh.cond;
  if (!applySetupInputs()) return toast('Compila almeno un valore');
  render(); toast('Setup salvato'); openSetup(cond);
}

/* ===================================================================
   STRATEGIA GARA (replica l'ACC Strategist, verificata su 4 gare)
   =================================================================== */
const numP = s => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; };
function paceP(s) {
  s = normTime(String(s)).trim().replace(',', '.');
  const m = s.match(/^(\d+):(\d+(?:\.\d+)?)$/);
  if (m) return Math.round((parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000) / 1000;
  const v = parseFloat(s); return isNaN(v) ? null : Math.round(v * 1000) / 1000;
}
const fPace = x => { const m = Math.floor(x / 60), r = x - m * 60; let sec = r.toFixed(3); if (r < 10) sec = '0' + sec; return m + ':' + sec; };
const fDur = x => { x = Math.round(x); const h = Math.floor(x / 3600), m = Math.floor((x % 3600) / 60), s = x % 60; return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; };
const fMS = x => { x = Math.round(x); const m = Math.floor(x / 60), s = x % 60; return m + ':' + (s < 10 ? '0' : '') + s; };
const ceilEps = x => Math.ceil(x - 1e-9);
function rte(x) { const f = Math.floor(x), d = x - f; if (d > 0.5) return f + 1; if (d < 0.5) return f; return f % 2 === 0 ? f : f + 1; } // arrotonda come il Strategist: la metà va al pari
function maxFuel(r, P) { const mL = P.mgu === 'giri' ? P.mg * P.cons : P.mg; return Math.max(...r.fuel.map((f, i) => i > 0 ? f + mL : f)); }

function stratPlan(P, stops) {
  const avail = P.D - stops * P.pit;
  let n = ceilEps(avail / P.pace); if (n < 1) n = 1;
  const low = avail / n, high = n > 1 ? avail / (n - 1) : null, s = stops + 1, full = P.form === 'full', tot = n + (full ? 1 : 0);
  const base = Math.floor(tot / s), r = tot % s, st = [];
  for (let i = 0; i < s; i++) st.push(base + (i < r ? 1 : 0));
  const marginL = P.mgu === 'giri' ? P.mg * P.cons : P.mg, extra0 = P.form === 'short' ? 0.5 * P.cons : 0, fuel = [];
  if (P.refuel) { for (let i = 0; i < s; i++) fuel.push(ceilEps(st[i] * P.cons + (i === 0 ? extra0 + marginL : 0))); }
  else { fuel.push(ceilEps(tot * P.cons + extra0 + marginL)); for (let i = 1; i < s; i++) fuel.push(0); }
  const racing = st.slice(); if (full) racing[0] -= 1;
  let lap = 0; const pits = [];
  for (let i = 0; i < s - 1; i++) { lap += racing[i]; pits.push([lap, rte(P.D - (lap * P.pace + i * P.pit))]); }
  return {n, dur: Math.round(n * P.pace + stops * P.pit), low, high, st, racing, fuel, pits, stops};
}
function stratCalc(P) {
  const notes = [], maxLaps = P.ms ? Math.floor(P.ms / P.pace) : null;
  let res = null;
  for (let stops = P.mand; stops <= P.mand + 40; stops++) {
    const r = stratPlan(P, stops); let ok = true;
    if (maxLaps != null && Math.max(...r.racing) > maxLaps) ok = false;
    if (P.refuel && maxFuel(r, P) > P.tank) ok = false;
    if (ok) { res = r; break; }
  }
  if (!res) { res = stratPlan(P, P.mand); notes.push('Nessun numero di soste rispetta i limiti inseriti: controlla serbatoio e durata massima stint.'); }
  else if (res.stops > P.mand) {
    const why = [], r0 = stratPlan(P, P.mand);
    if (maxLaps != null && Math.max(...r0.racing) > maxLaps) why.push('la durata massima stint');
    if (P.refuel && maxFuel(r0, P) > P.tank) why.push('il serbatoio');
    notes.push('Servono ' + res.stops + ' soste invece di ' + P.mand + ': ' + (why.join(' e ') || 'i limiti') + '.');
  }
  if (!P.refuel && res.fuel[0] > P.tank) notes.push('Senza rifornimento servono ' + res.fuel[0] + ' L alla partenza, più del serbatoio (' + P.tank + ' L). Questa gara non si può fare senza rifornire.');
  return {r: res, notes};
}

const norm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const hasShape = v => !!(v && v.shape && v.shape.pts && v.shape.pts.length > 2);
function catMatch(e) {                                   // la variante di questo gioco che sembra essere quella del catalogo
  for (const c of gCircuits()) {
    const n = norm(c.name);
    if (!e.keys.some(k => n.includes(k) || (n.length >= 3 && k.includes(n)))) continue;
    const vs = gVariants(c.id); if (vs.length) return vs.find(v => norm(v.name).includes('gp')) || vs[0];
  }
  return null;
}

  sheet('Catalogo piste', '<p class="meta">Carico il catalogo...</p>', 'Gioco: ' + GAME.name);

    const rows = cat.circuits.map((e, i) => {

      return `<div class="f2"><span><b>${esc(e.name)}</b> \u00b7 ${esc(e.variant)}</span><select data-cat="${i}"><option value="skip"${def === 'skip' ? ' selected' : ''}>Non toccare</option><option value="new"${def === 'new' ? ' selected' : ''}>Crea nuova pista</option>${all.map(o => `<option value="${o.v.id}"${def === o.v.id ? ' selected' : ''}>Disegna su: ${esc(o.label)}${hasShape(o.v) ? ' (sostituisce il disegno)' : ''}${def === o.v.id && hasShape(o.v) ? ' \u00b7 versione pi\u00f9 pulita' : ''}</option>`).join('')}</select></div>`;

    const e = UI.cat.circuits[+sel.dataset.cat], val = sel.value; if (val === 'skip') return;

/* trascinamento parametri nell'editor del gruppo (maniglia ⠿) */
(() => {
  let d = null;
  const clr = () => document.querySelectorAll('.dropt').forEach(e => e.classList.remove('dropt'));
  const target = (x, y) => {
    const el = document.elementFromPoint(x, y); if (!el) return null;
    const row = el.closest('.row2[data-pi]'); if (row && row !== d.row) return {row, el: row};
    const sub = el.closest('.sub'); if (sub) return {sub, el: sub};
    const sec = el.closest('.sec'); if (sec) return {sec, el: sec};
    return null;
  };
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('.dh'); if (!h || !UI.eg) return;
    e.preventDefault(); const row = h.closest('.row2');
    d = {row, id: h.setPointerCapture ? e.pointerId : null, y0: e.clientY}; h.setPointerCapture(e.pointerId); row.classList.add('drag');
  });
  document.addEventListener('pointermove', e => {
    if (!d) return; d.row.style.transform = `translateY(${e.clientY - d.y0}px)`;
    clr(); d.row.style.pointerEvents = 'none'; const t = target(e.clientX, e.clientY); d.row.style.pointerEvents = ''; d.t = t; if (t) t.el.classList.add('dropt');
    const sh = document.querySelector('.sheet'), r = sh.getBoundingClientRect();
    if (e.clientY < r.top + 50) sh.scrollTop -= 12; else if (e.clientY > r.bottom - 50) sh.scrollTop += 12;
  });
  const end = e => {
    if (!d) return; const {row, t} = d; d = null; clr(); row.classList.remove('drag'); row.style.transform = '';
    if (!t || e.type === 'pointercancel') return;
    const g = UI.eg; collectGroup();
    const si = +row.dataset.si, pi = +row.dataset.pi, bi = row.dataset.bi == null ? -1 : +row.dataset.bi;
    const cont = (a, b) => b >= 0 ? g.sections[a].subs[b].params : g.sections[a].params;
    const [it] = cont(si, bi).splice(pi, 1);
    let ds, db, di;
    if (t.row) { ds = +t.row.dataset.si; db = t.row.dataset.bi == null ? -1 : +t.row.dataset.bi; di = +t.row.dataset.pi; const r = t.row.getBoundingClientRect(); if (e.clientY > r.top + r.height / 2) di++; if (ds === si && db === bi && pi < di) di--; }
    else if (t.sub) { const sc = t.sub.closest('.sec'); ds = [...document.querySelectorAll('.sec')].indexOf(sc); db = [...sc.querySelectorAll('.sub')].indexOf(t.sub); di = 0; }
    else { ds = [...document.querySelectorAll('.sec')].indexOf(t.sec); db = -1; di = cont(ds, -1).length; }
    cont(ds, db).splice(di, 0, it); redrawGroup();
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();
function groupAction(act, btn) {
  const g = UI.eg;
  if (act === 'cancel') { const r = UI.egRet; closeSheet(); return r ? setupBack(r) : null; }
  collectGroup();
  const si = +btn.dataset.si, pi = +btn.dataset.pi, bi = btn.dataset.bi == null ? -1 : +btn.dataset.bi;
  const tgt = () => bi >= 0 ? g.sections[si].subs[bi] : g.sections[si];
  if (act === 'mvsec' || act === 'mvsub') {
    const d = +btn.dataset.d, arr = act === 'mvsec' ? g.sections : g.sections[si].subs, i = act === 'mvsec' ? si : bi, j = i + d;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; return redrawGroup();
  }
  if (act === 'mvpar') {   // su/giù; oltre il bordo di un blocco il parametro passa al blocco vicino (libero ↔ sottosezioni)
    const sec = g.sections[si], conts = [sec.params].concat((sec.subs || []).map(b => b.params)), ci = bi + 1, arr = conts[ci], d = +btn.dataset.d, j = pi + d;
    if (j >= 0 && j < arr.length) [arr[pi], arr[j]] = [arr[j], arr[pi]];
    else { const nc = conts[ci + d]; if (!nc) return; const [it] = arr.splice(pi, 1); if (d < 0) nc.push(it); else nc.unshift(it); }
    return redrawGroup();
  }
  if (act === 'addsec') { const n = {id: uid(), name: '', params: [], subs: []}; g.sections.push(n); return redrawGroup(`.sec[data-sid="${n.id}"] .sn`); }
  if (act === 'addpar') {
    const np = {id: uid(), label: ''}; tgt().params.push(np);
    const sec = g.sections[si]; if (bi >= 0 && sec.link !== false && sec.subs.length > 1) sec.subs.forEach((b, k) => { if (k !== bi) b.params.push({id: uid(), label: ''}); });
    return redrawGroup(`.pn[data-pid="${np.id}"]`);
  }
  if (act === 'addsub') { const n = {id: uid(), name: '', params: []}; (g.sections[si].subs = g.sections[si].subs || []).push(n); return redrawGroup(`.sub[data-sid="${n.id}"] .subn`); }
  if (act === 'delsub') { g.sections[si].subs.splice(bi, 1); return redrawGroup(); }
  if (act === 'delsec') { g.sections.splice(si, 1); return redrawGroup(); }
  if (act === 'delpar') {
    const lab = (tgt().params[pi] || {label: ''}).label.trim().toLowerCase(); tgt().params.splice(pi, 1);
    const sec = g.sections[si]; if (bi >= 0 && lab && sec.link !== false && sec.subs.length > 1) sec.subs.forEach((b, k) => { if (k === bi) return; const x = b.params.findIndex(p => p.label.trim().toLowerCase() === lab); if (x >= 0) b.params.splice(x, 1); });
    return redrawGroup();
  }
  if (act === 'tpl') {
    const tp = tplFor((DB.games.find(x => x.id === g.gameId) || GAME).name); if (!tp) return;
    if (g.sections.some(x => x.params.length || (x.subs || []).length) && !armed(btn, 'Sostituisco i parametri attuali: conferma')) return;
    g.sections = parseOutline(tp.text); return redrawGroup();
  }
  if (act === 'paste') { $('pasteBox').hidden = !$('pasteBox').hidden; return; }
  if (act === 'pasteadd') {
    $('pasteBox').hidden = true;
    let cur = g.sections[g.sections.length - 1];
    $('pasteTx').value.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      if (l.startsWith('##')) { const sec = g.sections[g.sections.length - 1] || (g.sections.push({id: uid(), name: 'Generale', params: [], subs: []}), g.sections[0]); sec.subs = sec.subs || []; cur = {id: uid(), name: l.replace(/^#+\s*/, ''), params: []}; sec.subs.push(cur); }
      else if (l[0] === '#') { cur = {id: uid(), name: l.replace(/^#+\s*/, ''), params: [], subs: []}; g.sections.push(cur); }
      else { if (!cur) { cur = {id: uid(), name: 'Generale', params: [], subs: []}; g.sections.push(cur); } cur.params.push({id: uid(), label: l}); }
    });
    return redrawGroup();
  }
  if (act === 'save') {
    if (!g.name) return toast('Scrivi il nome del gruppo');
    g.sections = g.sections.map(s => ({...s, params: s.params.filter(p => p.label), subs: (s.subs || []).map(b => ({...b, name: b.name || 'Sottosezione', params: b.params.filter(p => p.label)})).filter(b => b.params.length)})).filter(s => s.name || s.params.length || s.subs.length);
    g.sections.forEach(s => { if (!s.name) s.name = 'Generale'; });
    g.u = now();
    const i = DB.groups.findIndex(x => x.id === g.id);
    if (i >= 0) DB.groups[i] = g; else { g.id = uid(); DB.groups.push(g); DB.settings.sel.g = g.id; DB.settings.sel.a = null; }
    const r = UI.egRet; save(); closeSheet(); render(); toast('Gruppo salvato'); return r ? setupBack(r) : null;
  }
  if (act === 'del') {
    const n = DB.cars.filter(a => a.gid === g.id).length;
    if (!armed(btn, n ? `Conferma: elimina gruppo e ${n} auto` : 'Conferma eliminazione')) return;
    DB.cars.filter(a => a.gid === g.id).forEach(a => removeCar(a.id));
    removeGroupData(g.id);
    DB.groups = DB.groups.filter(x => x.id !== g.id);
    save(); closeSheet(); render(); toast('Gruppo eliminato');
  }
}

    if (vs.some(v => !v.games.length)) return toast('Ogni variante deve esistere in almeno un gioco');
    const lost = [];
    vs.forEach(v => { const old = DB.variants.find(x => x.id === v.id); if (old) old.games.filter(g => !v.games.includes(g)).forEach(g => { if (variantHasData(old.id, g)) lost.push(g); }); });

    const keep = new Set(vs.map(v => v.id));
    DB.variants.filter(v => v.cid === c.id && !keep.has(v.id)).forEach(v => removeVariant(v.id));
    vs.forEach(v => {

    });
    if (isNewC) { DB.settings.sel.c = c.id; DB.settings.sel.v = vs[0].id; resetMapState(); }
    save(); closeSheet(); render(); return toast('Circuito salvato');
  }
  if (act === 'del') {
    if (!armed(btn, 'Conferma: cancella anche i dati')) return;
    DB.variants.filter(v => v.cid === e.id).forEach(v => removeVariant(v.id));
    DB.circuits = DB.circuits.filter(x => x.id !== e.id);

  }

      ${late ? '<div class="warn">Non fai un backup su file da più di 7 giorni. Salvalo, così non perdi i dati se cambi telefono o il browser li cancella.</div>' : ''}
      <div class="btns">${canShare ? '<button class="pri" data-bk="share">Condividi backup</button>' : ''}<button class="${canShare ? 'sec2' : 'pri'}" data-bk="download">Scarica file</button>${window.showSaveFilePicker ? '<button class="sec2" data-bk="savefile">Salva in una cartella</button>' : ''}<button class="sec2" data-bk="pick">Ripristina da file</button></div>
      <input type="file" id="fileIn" accept=".json,application/json" hidden>
      ${canShare ? '<p class="meta" style="margin-top:8px">Condividi backup apre il menu di Android: scegli Drive per salvarlo nel cloud.</p>' : ''}
      ${pend}</div>
    <div class="card"><h2>Copie interne</h2>
      <p class="meta">Copie automatiche dentro il browser, fatte quando apri l'app. Non sostituiscono il backup su file.</p>
      <div class="grid" style="margin:10px 0">
        <label class="f">Frequenza<select data-cp="every">
          <option value="open"${c.every === 'open' ? ' selected' : ''}>Ad ogni apertura</option>

      </div>
      <div id="copies"><p class="meta">Carico...</p></div></div>
    <div class="card"><h2>Cancella dati</h2>
      <p class="meta">Vale solo per questo dispositivo: su ogni telefono o tablet va fatto a parte. Prima di cancellare salvo una copia interna, che trovi qui sopra e puoi ripristinare.</p>
      <div class="btns"><button class="sec2" data-bk="wipedata">Cancella i dati, tieni piste e curve</button><button class="sec2" data-bk="wipeall">Cancella tutto</button></div>
      <p class="meta" style="margin-top:8px">La prima toglie gruppi, auto, staccate, setup, dati rapidi, strategie e note, e lascia circuiti, disegni e curve. La seconda riporta l'app com'era appena installata.</p></div>
    <div class="card"><h2>Archivio</h2>
      <p class="meta">Salvataggio nel browser: ${memOnly ? '<b>non disponibile</b>' : 'attivo'}${UI.persisted === true ? ' · protetto dalla pulizia automatica' : UI.persisted === false ? ' · non protetto dalla pulizia automatica' : ''}</p>
      <p class="meta">Dati: ${esc(summary(DB))}</p>
      <p class="meta">App versione ${APP_V} · formato dati ${DATA_V}</p>
      <div class="btns"><button class="sec2" data-bk="update">Controlla aggiornamenti</button></div></div>`;
}
function fillCopies() {
  listCopies().then(list => {
    const box = $('copies'); if (!box) return;
    box.innerHTML = list.length
      ? list.map(c => `<div class="item"><div><b>${esc(fdt(c.t))}</b><span class="meta">${esc(c.why)}</span></div><button class="ed" data-restore="${c.id}">Ripristina</button></div>`).join('')
      : '<div class="empty">Ancora nessuna copia. La prima si crea quando ci sono dei dati.</div>';
  });
}

/* ===================================================================
   EVENTI
   =================================================================== */
const ACT = {
  dict: openDict, dictmic: dictMic, dictparse: dictParse, dictsave: dictSave,
  close: closeSheet,
  draw: editDrawing, turns: editTurns, perf: b => editPerf(b && b.dataset ? b.dataset.part : 'all'), strat: openStrat, notes: openNotes,
  later: () => { UI.placing = null; drawMap(); toast('Resta da posizionare: il promemoria è sopra la mappa'); },
  move: () => { UI.move = !UI.move; UI.edit = false; UI.trkMove = false; UI.placing = null; drawMap(); },
  trkmove: () => { UI.trkMove = !UI.trkMove; drawMap(); },
  bgdel: () => { if (!V.shape.photo) return; delete V.shape.photo; delete V.shape.bg; delete V.shape.bgAr; UI.trkMove = false; save(); drawMap(); toast('Foto tolta'); },

  },

    pushUndo(); V.shape.pts = V.shape.pts.filter((_, i) => i % 2 === 0); UI.selPt = null; V.u = now(); save(); drawMap(); toast(V.shape.pts.length + ' punti');
  },
  ptundo: () => {
    const u = (UI.undo || []).pop(); if (!u) return;
    V.shape.pts = u; UI.selPt = null; V.u = now(); save(); drawMap();
  },
  setup: b => openSetup(b.dataset.cond),
  setupmode: b => openSetup(b.dataset.cond, b.dataset.mode),
  setupedit: b => editSetup(b.dataset.cond, b.dataset.scope),
  setupsave: saveSetup,
  setupback: () => openSetup(UI.sh.cond),
  setupstruct: b => {
    const cond = b.dataset.cond, scope = b.dataset.scope || null;
    if (scope && UI.sh) applySetupInputs();
    UI.egRet = {cond, scope}; editGroup(G.id);
  },
  carparams: b => openCarParams(b.dataset.cond),
  cpadd: () => { collectCarParams(); const hid = {...(A.hide || {})}; document.querySelectorAll('[data-hid]').forEach(i => { if (!i.checked) hid[i.dataset.hid] = true; else delete hid[i.dataset.hid]; }); A.hide = hid; UI.cp.extra.push({id: uid(), label: ''}); drawCarParams(); },
  cpdel: b => { collectCarParams(); UI.cp.extra.splice(+b.dataset.i, 1); drawCarParams(); },
  cpback: () => openSetup(UI.cp.cond),
  cpsave: () => {
    collectCarParams();
    const hide = {}; document.querySelectorAll('[data-hid]').forEach(i => { if (!i.checked) hide[i.dataset.hid] = true; });
    A.hide = hide; A.extra = UI.cp.extra.filter(e => e.label); A.u = now();
    save(); const c = UI.cp.cond; render(); openSetup(c); toast('Parametri di questa auto salvati');
  },
  setupcopy: () => { const dry = ((DB.setupGen[A.id] || {}).dry || {vals: {}}).vals; document.querySelectorAll('.sheet input[data-pid]').forEach(i => { if (!i.value && dry[i.dataset.pid] != null) i.value = dry[i.dataset.pid]; }); },
  ctltoggle: () => { UI.ctlHide = !UI.ctlHide; drawMap(); },
  guide: () => guideOpen('prob'),
  guidetab: b => guideOpen(b.dataset.t),
  guideclose: () => { const e = $('guide'); if (e) e.remove(); },
  parinfo: b => guideOpen('par', b.dataset.l),
  secjump: b => { const t = document.getElementById('sec' + b.dataset.i), sh = document.querySelector('.sheet'), bar = document.querySelector('.sbar'); if (t && sh && bar) sh.scrollTo({top: sh.scrollTop + t.getBoundingClientRect().top - bar.getBoundingClientRect().bottom - 4, behavior: 'smooth'}); },
  openall: b => { const open = b.getAttribute('aria-pressed') !== 'true'; document.querySelectorAll('.sheet details').forEach(d => { d.open = open; }); b.setAttribute('aria-pressed', open); b.textContent = open ? 'Chiudi tutto' : 'Apri tutto'; },
  brake: b => editBrake(b.dataset.tid), brakesave: saveBrake,
  quick: b => { $(b.dataset.to).value = b.dataset.v; },
  menu: () => sheet('Menu', `<div class="btns" style="flex-direction:column;align-items:stretch"><button class="sec2" data-act="catalog">Catalogo piste (disegni già pronti)</button>${DB.variants.some(v => !v.games.includes(GAME.id)) ? '<button class="sec2" data-act="importvar">Aggiungi una pista da un altro gioco</button>' : ''}<button class="sec2" data-act="quickedit">Pulsanti rapidi delle staccate</button></div>`, 'Gioco: ' + GAME.name),
  turnq: () => {
    if (!needCtx('gv')) return;
    ownVariant(); if (!V.shape) V.shape = {pts: [], closed: true, h: 240, turns: []};
    const t = {id: uid(), n: '', u: now()}; V.shape.turns = V.shape.turns || []; V.shape.turns.push(t); save(); render(); editBrake(t.id);
  },
  braketdel: b => {
    if (!armed(b, 'Conferma: cancella la curva e le sue staccate')) return;
    const tid = UI.sh.tid; ownVariant(); removeTurnData(V.id, tid); V.shape.turns = V.shape.turns.filter(x => x.id !== tid); save(); closeSheet(); render(); toast('Curva eliminata');
  },
  turnadd: () => { collectTurns(); UI.tu.push({id: uid(), n: '', u: now()}); drawTurns(); },
  turndel: b => { collectTurns(); UI.tu.splice(+b.dataset.i, 1); drawTurns(); },
  turnpaste: () => { $('tpaste').hidden = !$('tpaste').hidden; },
  turnpasteadd: () => { collectTurns(); $('tpTx').value.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => UI.tu.push({id: uid(), n: l, u: now()})); drawTurns(); },
  turnsave: saveTurns,
  drundo: () => { UI.dr.pts.pop(); drawDrSvg(); },
  drclose: () => { UI.dr.closed = !UI.dr.closed; drawDrawing(); },
  drreset: () => { UI.dr.pts = []; UI.dr.maskUrl = null; UI.dr.seed = null; UI.dr.warn = ''; drawDrSvg(); },
  drauto: () => { UI.dr.auto = !UI.dr.auto; drawDrawing(); },
  drsave: saveDrawing,
  pfadd: () => { collectPerf(); UI.pf.cons.push({map: '', v: '', main: !UI.pf.cons.length}); drawPerf(); },
  pfdel: b => { collectPerf(); const [x] = UI.pf.cons.splice(+b.dataset.i, 1); if (x.main && UI.pf.cons.length) UI.pf.cons[0].main = true; drawPerf(); },
  pfmain: b => { collectPerf(); UI.pf.cons.forEach((c, i) => { c.main = i === +b.dataset.i; }); drawPerf(); },
  pfsave: savePerf,
  hist: () => openHist(),
  histtab: b => openHist(b.dataset.g),
  histdel: b => { DB.hist = (DB.hist || []).filter(e => e.id !== b.dataset.id); save(); openHist(); },
  noteedit: b => editNote(b.dataset.id, b.dataset.lvl, b.dataset.key),
  noteback: openNotes, notesave: saveNote,
  notedel: b => { if (!armed(b, 'Conferma eliminazione')) return; DB.notes = DB.notes.filter(n => n.id !== UI.sh.note.id); save(); render(); toast('Nota eliminata'); openNotes(); },
  importvar: openImportVar, catalog: openCatalog, catapply: applyCatalog,
  varshare: b => { const v = DB.variants.find(x => x.id === b.dataset.id); v.games.push(GAME.id); save(); closeSheet(); render(); toast('Pista aggiunta a ' + GAME.name); },
  varcopy: b => { const o = DB.variants.find(x => x.id === b.dataset.id), n = {id: uid(), cid: o.cid, name: o.name, games: [GAME.id], u: now()}; DB.variants.push(n); copyVariantData(o.id, n.id); save(); closeSheet(); render(); toast('Pista copiata in ' + GAME.name); },
  quickedit: editQuick, quickadd: () => { collectQuick(); UI.sh.q.push({id: uid(), label: ''}); drawQuick(); },
  quickdel: b => { collectQuick(); UI.sh.q.splice(+b.dataset.i, 1); drawQuick(); }, quicksave: saveQuick
};
const resetMapState = () => { UI.scope = 'all'; UI.vb = null; UI.selTurn = null; UI.placing = null; UI.move = false; UI.edit = false; UI.trkMove = false; UI.selPt = null; UI.undo = []; };

document.addEventListener('click', e => {
  const t = e.target;
  if (noClick) { noClick = false; return; }
  const tab = t.closest('[data-tab]'); if (tab) { UI.tab = tab.dataset.tab; UI.pending = null; render(); window.scrollTo(0, 0); return; }
  const go = t.closest('[data-go]'); if (go) { UI.tab = go.dataset.go; render(); window.scrollTo(0, 0); return; }
  const zb = t.closest('[data-zoom]');
  if (zb) { const z = zb.dataset.zoom; if (z === 'fit') { UI.vb = null; drawMap(); } else zoomBy(z === 'in' ? 1.5 : 1 / 1.5); return; }
  const pl = t.closest('[data-place]'); if (pl) { UI.selTurn = pl.dataset.place; UI.placing = UI.selTurn; drawMap(); renderRows(); return; }
  const msvg = t.closest('#mapBox svg');
  if (msvg && UI.placing) {
    const forked = ownVariant();
    const q = toSvg(e.clientX, e.clientY), tt = turnsOf().find(x => x.id === UI.placing), H = shapeH();
    if (tt) { tt.x = clampN(Math.round(q.x), -150, 550); tt.y = clampN(Math.round(q.y), -150, H + 150); tt.u = now(); }
    const num = turnsOf().indexOf(tt) + 1;
    UI.placing = null; save(); if (forked) render(); else { drawMap(); renderRows(); } toast('Curva ' + num + ' posizionata'); return;
  }
  const dsv = t.closest('#drSvg');
  if (dsv && UI.dr) {
    const r = dsv.getBoundingClientRect(), x = Math.round((e.clientX - r.left) / r.width * 400), y = Math.round((e.clientY - r.top) / r.height * UI.dr.h);
    if (UI.dr.auto) { UI.dr.seed = [x, y]; UI.dr.warn = 'Cerco la pista...'; drawDrSvg(); runAuto(); return; }
    UI.dr.pts.push([x, y]); drawDrSvg(); return;
  }
  if (msvg && UI.edit && !UI.trkMove) {
    const h = t.closest('[data-pt]');
    if (h) { UI.selPt = +h.dataset.pt; drawMap(); return; }
    if (!addPointAt(toSvg(e.clientX, e.clientY))) { UI.selPt = null; drawMap(); }
    return;
  }
  const mk = t.closest('[data-turn]'); if (mk) { pickTurn(mk.dataset.turn); return; }
  const ac = t.closest('[data-act]'); if (ac && ACT[ac.dataset.act]) return ACT[ac.dataset.act](ac);
  const row = t.closest('[data-row]'); if (row) { pickTurn(row.dataset.row); return; }
  const ed = t.closest('[data-edit]');
  if (ed) { const k = ed.dataset.edit; return k === 'group' ? editGroup(ed.dataset.id) : k === 'car' ? editCar(ed.dataset.id) : k === 'game' ? editGame(ed.dataset.id) : editCircuit(ed.dataset.id); }
  const eg = t.closest('[data-eg]'); if (eg && UI.eg) return groupAction(eg.dataset.eg, eg);
  const ec = t.closest('[data-ec]'); if (ec && UI.ec) return UI.ec.kind === 'car' ? carAction(ec.dataset.ec, ec) : UI.ec.kind === 'game' ? gameAction(ec.dataset.ec, ec) : circuitAction(ec.dataset.ec, ec);
  const bk = t.closest('[data-bk]');
  if (bk) {
    const a = bk.dataset.bk;
    if (a === 'syncin') return syncEnable();
    if (a === 'syncout') return syncDisable();
    if (a === 'syncnow') return syncNow();
    if (a === 'syncmine') return syncResolve(true);
    if (a === 'synccloud') return syncResolve(false);
    if (a === 'share') return shareBackup();
    if (a === 'download') return downloadBackup();
    if (a === 'pick') return $('fileIn').click();
    if (a === 'savefile') return window.showSaveFilePicker({suggestedName: backupName(), types: [{description: 'Backup Simapex', accept: {'application/json': ['.json']}}]})
      .then(h => h.createWritable()).then(w => w.write(backupText()).then(() => w.close()))
      .then(() => { DB.settings.lastExport = now(); save(); render(); toast('Backup salvato'); })
      .catch(err => { if (err && err.name !== 'AbortError') toast('Salvataggio non riuscito: usa Scarica file.'); });
    if (a === 'wipedata' || a === 'wipeall') {
      if (!armed(bk, a === 'wipeall' ? 'Tocca ancora: cancello TUTTO' : 'Tocca ancora per cancellare')) return;
      return addCopy('prima della cancellazione').then(() => {
        const keep = DB.settings, games = DB.games;
        if (a === 'wipeall') { DB = newDB(); DB.settings.copies = keep.copies; DB.settings.quick = keep.quick; DB.settings.lastExport = keep.lastExport; }
        else { Object.assign(DB, {groups: [], cars: [], brakes: {}, pits: {}, perf: {}, setupGen: {}, setupSpec: {}, notes: [], hist: []}); DB.settings.sel = {game: DB.settings.sel.game, c: DB.settings.sel.c, v: DB.settings.sel.v}; }
        UI.vb = null; UI.selTurn = null; return flush();
      }).then(() => { render(); toast(a === 'wipeall' ? 'Tutto cancellato' : 'Dati cancellati, piste e curve restano'); });
    }
    if (a === 'apply') return applyRestore();
    if (a === 'cancel') { UI.pending = null; return render(); }
    if (a === 'update') {
      if (!navigator.serviceWorker) return toast('Aggiornamenti non disponibili in questo browser');
      return navigator.serviceWorker.getRegistration().then(r => r ? r.update().then(() => toast('Controllo fatto. Se c\'è una versione nuova ti avviso.')) : toast('Installazione offline non ancora attiva'));
    }
  }
  const rs = t.closest('[data-restore]');
  if (rs) listCopies().then(l => {
    const c = l.find(x => x.id === +rs.dataset.restore); if (!c) return;
    UI.pending = {data: JSON.parse(c.data), label: 'la copia del ' + fdt(c.t)}; render(); window.scrollTo(0, 0);
  });
});
document.addEventListener('input', e => {
  const t = e.target; if (!V || !V.shape) return;
  if (t.id === 'bgO') { const bg = V.shape.bg = bgOf(V.shape); bg.o = t.value / 100; const g = $('trkLine'); if (g) g.setAttribute('opacity', bg.o); }
  if (t.id === 'trkS') { const tt = UI.trk = UI.trk || {dx: 0, dy: 0, s: 1}; tt.s = t.value / 100; applyTrk(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (UI.eg && t.dataset && t.dataset.mvto) {   // sposta un parametro in un'altra sezione o sottosezione
    if (!t.value) return;
    collectGroup(); const g = UI.eg, si = +t.dataset.si, bi = t.dataset.bi == null ? -1 : +t.dataset.bi, pi = +t.dataset.pi, [ds, db] = t.value.split(':').map(Number);
    const src = bi < 0 ? g.sections[si].params : g.sections[si].subs[bi].params, dst = db < 0 ? g.sections[ds].params : g.sections[ds].subs[db].params;
    const [it] = src.splice(pi, 1); dst.push(it); return redrawGroup();
  }
  if (UI.eg && t.classList && t.classList.contains('pn') && t.closest('.sub')) {   // rinomina collegata nelle sottosezioni
    const g = UI.eg; let old = null, secI = -1, subI = -1;
    g.sections.forEach((s, si) => (s.subs || []).forEach((b, bi) => b.params.forEach(p => { if (p.id === t.dataset.pid) { old = p.label; secI = si; subI = bi; } })));
    collectGroup();
    const sec = g.sections[secI];
    if (old !== null && sec && sec.link !== false && (sec.subs || []).length > 1) {
      const nv = t.value.trim(); let n = 0;
      sec.subs.forEach((b, bi) => { if (bi === subI) return; const q = b.params.find(p => p.label.trim().toLowerCase() === old.trim().toLowerCase()); if (q && q.label !== nv) { q.label = nv; n++; } });
      if (n) { redrawGroup(); toast('Rinominato in ' + (n + 1) + ' sottosezioni'); }
    }
    return;
  }
  if (t.id === 'bgIn' && t.files[0]) { loadBg(t.files[0]); t.value = ''; return; }
  if (t.id === 'bgO') { save(); return; }
  if (t.id === 'trkS') { bakeTrk(); drawMap(); return; }
  if (t.id === 'fileIn' && t.files[0]) { readBackupFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'photoIn' && t.files[0]) { loadPhoto(t.files[0]); t.value = ''; return; }
  if (t.dataset.sel && t.value === '__new__') {
    const k = t.dataset.sel; render();
    if (k === 'game') return editGame();
    if (k === 'c') return editCircuit();
    if (k === 'g') return editGroup();
    if (k === 'a') return editCar();
    if (k === 'v') { if (!C) return editCircuit(); editCircuit(C.id); UI.ec.vs.push({id: uid(), name: '', isNew: true, from: '', games: [GAME.id]}); return drawCircuit(C.name); }
  }
  if (t.dataset.sel) {
    const s = DB.settings.sel; s[t.dataset.sel] = t.value;
    if (t.dataset.sel === 'c') s.v = null;
    if (t.dataset.sel === 'g') s.a = null;
    if (t.dataset.sel === 'game') { s.c = s.v = s.g = s.a = null; }
    if (t.dataset.sel === 'c' || t.dataset.sel === 'v' || t.dataset.sel === 'game') resetMapState();
    save(); render(); return;
  }
  if ('scope' in t.dataset) { UI.scope = t.value; drawMap(); return; }
  if (t.dataset.cp) {
    DB.settings.copies[t.dataset.cp] = t.dataset.cp === 'keep' ? +t.value : t.value;
    save(); pruneCopies().then(fillCopies);
  }
});
document.addEventListener('input', e => { if (e.target.id === 'drTol' && UI.dr) { UI.dr.tol = +e.target.value; runAuto(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('layer').firstChild) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.turn) { e.preventDefault(); pickTurn(e.target.dataset.turn); }
});

/* ===================================================================
   AVVIO
   =================================================================== */
function start() {
  $('ver').textContent = 'v' + APP_V;
  openArchive().then(db => { idb = db; return tx('kv', 'readonly', s => s.get('db')); })
    .catch(() => { memOnly = true; showNotice('Il browser non permette di salvare i dati (navigazione privata?). Apri Simapex in una finestra normale.'); return null; })
    .then(txt => {
      if (txt) {
        const d = JSON.parse(txt);
        DB = valid(d) ? migrate(d) : newDB();
        if (!valid(d)) showNotice('I dati salvati non erano leggibili: riparti da zero oppure ripristina un backup.');
        else if (d.v !== DATA_V) save();
      } else DB = newDB();
      DB.settings.copies = DB.settings.copies || {every:'day', keep:5};
      render();
      if (syncOn()) syncStart(false);
      if (idb) maybeCopy();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(p => { UI.persisted = p; if (UI.tab === 'backup') render(); });
    });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (had) $('notice').innerHTML = '<div class="banner" style="margin-bottom:12px"><span>Nuova versione pronta.</span><button class="sec2" onclick="location.reload()">Ricarica</button></div>';
    });
  }
}
start();
