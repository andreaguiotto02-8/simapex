<body>
<div class="wrap">
  <div class="top"><h1>Simapex</h1><span style="display:flex;align-items:center;gap:10px"><span class="ver" id="ver"></span><button class="ed" data-act="menu" aria-label="Menu" style="min-height:40px;min-width:44px;padding:0 12px;font-size:20px;line-height:1">⋯</button></span></div>
  <div id="notice"></div>
  <main id="main"></main>
</div>
<nav aria-label="Sezioni">
  <button class="tab" data-tab="home">Consulta</button>
  <button class="tab" data-tab="backup">Backup</button>
</nav>
<div id="layer"></div>

<script>
'use strict';
/* ===================================================================
   SIMAPEX - un solo file. Ordine: strumenti, archivio (IndexedDB), backup,
   selezione, mappa, schermata Consulta, editor, strategia, Dati, Backup,
   eventi, avvio.
   =================================================================== */

const APP_V = '0.31.1';   // versione dell'app
const DATA_V = 3;      // versione del formato dei dati
const DEFAULT_QUICK = ['Cartello 150', 'Cartello 100', 'Cartello 50', 'Fine cordolo'];
// Quando il formato dei dati cambia: aumenta DATA_V e aggiungi qui la funzione che porta
// i dati vecchi al formato nuovo. MIGRATIONS[1] porta i dati dalla versione 1 alla 2.
const MIGRATIONS = {
  1: db => {
    db.brakes = db.brakes || {}; db.pits = db.pits || {}; db.perf = db.perf || {};
    db.setupGen = db.setupGen || {}; db.setupSpec = db.setupSpec || {}; db.notes = db.notes || [];
    db.settings.quick = db.settings.quick || DEFAULT_QUICK.map(l => ({id: uid(), label: l}));
  },
  // 2 -> 3: i giochi diventano un elenco; ogni gruppo sta in un gioco, ogni variante dice in quali giochi esiste
  2: db => {
    const names = [...new Set(db.groups.map(g => (g.game || '').trim()).filter(Boolean))];
    if (!names.length) names.push('ACC');
    db.games = names.map(n => ({id: uid(), name: n}));
    db.groups.forEach(g => { const m = db.games.find(x => x.name === (g.game || '').trim()) || db.games[0]; g.gameId = m.id; delete g.game; });
    db.variants.forEach(v => { v.games = db.games.map(x => x.id); });
  }
};

/* ---------- Strumenti ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => new Date().toISOString();

/* ---------- Archivio: IndexedDB ---------- */
let idb = null, memOnly = false;

function openArchive() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('simapex', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('copies', {keyPath:'id', autoIncrement:true}); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = idb.transaction(store, mode), rq = fn(t.objectStore(store));
    t.oncomplete = () => res(rq ? rq.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}

function migrate(d) {
  while (d.v < DATA_V) { const f = MIGRATIONS[d.v]; if (f) f(d); d.v++; }

function valid(d) {

    Array.isArray(d.groups) && Array.isArray(d.cars) && Array.isArray(d.circuits) && Array.isArray(d.variants) &&

}

async function packDB() {

  out.settings = {quick: DB.settings.quick};
  let txt = JSON.stringify(out), z = 0;
  if (window.CompressionStream) {
    const buf = new Uint8Array(await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
    let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    txt = btoa(bin); z = 1;
  }
  if (txt.length > 950000) throw new Error('troppo grande');
  return {z, d: txt, u: DB.u, v: DATA_V, n: count(DB), t: now()};
}
async function unpackDB(doc) {
  let txt = doc.d;
  if (doc.z) txt = await new Response(new Blob([Uint8Array.from(atob(txt), c => c.charCodeAt(0))]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);

const listCopies = () => idb ? tx('copies', 'readonly', s => s.getAll()).then(l => l.sort((a, b) => a.t < b.t ? 1 : -1)) : Promise.resolve([]);
function addCopy(why) {
  if (!idb) return Promise.resolve();
  return tx('copies', 'readwrite', s => s.add({t: now(), why, data: JSON.stringify(DB)})).then(pruneCopies);
}
function pruneCopies() {
  return listCopies().then(list => {
    const keep = DB.settings.copies.keep || 5, extra = list.slice(keep);
    return extra.length ? tx('copies', 'readwrite', s => { extra.forEach(c => s.delete(c.id)); }) : null;
  });
}
function maybeCopy() {
  const c = DB.settings.copies;
  return listCopies().then(list => {
    const last = list.length ? Date.parse(list[0].t) : 0;
    const gap = {open: 0, day: 20 * 3600e3, week: 6.5 * 86400e3}[c.every];
    if (isEmpty(DB) || Date.now() - last < gap) return;
    return addCopy('automatica');
  });
}

const backupName = () => 'backup-simapex-' + today() + '.json';
const backupText = () => JSON.stringify({app:'simapex', exported: now(), data: DB});
function backupFile() { return new File([backupText()], backupName(), {type:'application/json'}); }

function shareBackup() {
  const f = backupFile();
  if (!(navigator.canShare && navigator.canShare({files:[f]}))) { toast('Questo dispositivo non può condividere file: usa Scarica file.'); return; }
  navigator.share({files:[f], title: backupName()})

    .catch(e => { if (e && e.name !== 'AbortError') toast('Condivisione non riuscita: usa Scarica file.'); });
}
function downloadBackup() {
  const url = URL.createObjectURL(backupFile()), a = document.createElement('a');
  a.href = url; a.download = backupName(); document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  DB.settings.lastExport = now(); save(); render(); toast('Backup scaricato nella cartella Download');

function readBackupFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), d = j && j.app === 'simapex' ? j.data : null;
      if (!valid(d)) throw new Error();
      UI.pending = {data: d, label: file.name};
      render();
    } catch (e) { toast('Questo file non è un backup di Simapex valido.'); }
  };
  r.readAsText(file);
}

/* ---------- Pulizia dei dati legati a gruppi, auto, varianti, curve ---------- */
const dropKeys = (obj, test) => Object.keys(obj).forEach(k => { if (test(k)) delete obj[k]; });
function removeCar(id) {
  DB.cars = DB.cars.filter(a => a.id !== id);
  delete DB.setupGen[id];
  dropKeys(DB.perf, k => k.startsWith(id + '|'));
  dropKeys(DB.setupSpec, k => k.startsWith(id + '|'));
  DB.notes = DB.notes.filter(n => n.key !== id && !n.key.startsWith(id + '|'));
}
function removeVariant(id) {
  DB.variants = DB.variants.filter(v => v.id !== id);
  dropKeys(DB.brakes, k => k.startsWith(id + '|'));
  dropKeys(DB.pits, k => k.startsWith(id + '|'));
  dropKeys(DB.perf, k => k.endsWith('|' + id));
  dropKeys(DB.setupSpec, k => k.endsWith('|' + id));
  DB.notes = DB.notes.filter(n => n.key !== id && !n.key.endsWith('|' + id));
}

/* Copia da una variante a un'altra: disegno e curve sempre; staccate, tempi di sosta e setup specifici
   solo per i giochi che le due varianti hanno in comune. */
function copyVariantData(fromId, toId) {
  const src = DB.variants.find(v => v.id === fromId), dst = DB.variants.find(v => v.id === toId);
  if (!src || !dst) return;
  const label = (DB.circuits.find(c => c.id === src.cid) || {}).name + ' ' + src.name;
  if (src.shape) dst.shape = clone(src.shape);
  const common = src.games.filter(g => dst.games.includes(g));
  const groups = new Set(DB.groups.filter(g => common.includes(g.gameId)).map(g => g.id));
  const cars = new Set(DB.cars.filter(a => groups.has(a.gid)).map(a => a.id));
  Object.keys(DB.brakes).filter(k => k.startsWith(fromId + '|') && groups.has(k.slice(fromId.length + 1))).forEach(k => { DB.brakes[toId + k.slice(fromId.length)] = clone(DB.brakes[k]); });
  Object.keys(DB.pits).filter(k => k.startsWith(fromId + '|') && groups.has(k.slice(fromId.length + 1))).forEach(k => { DB.pits[toId + k.slice(fromId.length)] = {...clone(DB.pits[k]), st:'copiato', from: label, u: now()}; });
  Object.keys(DB.setupSpec).filter(k => k.endsWith('|' + fromId) && cars.has(k.slice(0, k.length - fromId.length - 1))).forEach(k => { DB.setupSpec[k.slice(0, k.length - fromId.length) + toId] = clone(DB.setupSpec[k]); });
}
/* Dati di una variante che appartengono a un gioco (gruppi e auto di quel gioco) */
function gameKeys(gid) {
  const groups = new Set(DB.groups.filter(g => g.gameId === gid).map(g => g.id));
  return {groups, cars: new Set(DB.cars.filter(a => groups.has(a.gid)).map(a => a.id))};
}
function variantHasData(vid, gid) {
  const {groups, cars} = gameKeys(gid);
  return Object.keys(DB.brakes).some(k => k.startsWith(vid + '|') && groups.has(k.slice(vid.length + 1))) ||
    Object.keys(DB.pits).some(k => k.startsWith(vid + '|') && groups.has(k.slice(vid.length + 1))) ||
    Object.keys(DB.perf).some(k => k.endsWith('|' + vid) && cars.has(k.slice(0, k.length - vid.length - 1))) ||
    Object.keys(DB.setupSpec).some(k => k.endsWith('|' + vid) && cars.has(k.slice(0, k.length - vid.length - 1)));
}
function detachVariantFromGame(v, gid) {      // toglie una variante da un gioco e cancella i dati di quel gioco
  const {groups, cars} = gameKeys(gid);
  dropKeys(DB.brakes, k => k.startsWith(v.id + '|') && groups.has(k.slice(v.id.length + 1)));
  dropKeys(DB.pits, k => k.startsWith(v.id + '|') && groups.has(k.slice(v.id.length + 1)));
  dropKeys(DB.perf, k => k.endsWith('|' + v.id) && cars.has(k.slice(0, k.length - v.id.length - 1)));
  dropKeys(DB.setupSpec, k => k.endsWith('|' + v.id) && cars.has(k.slice(0, k.length - v.id.length - 1)));
  DB.notes = DB.notes.filter(n => !(n.lvl === 'both' && n.key.endsWith('|' + v.id) && cars.has(n.key.slice(0, n.key.length - v.id.length - 1))));
  v.games = v.games.filter(x => x !== gid);
}
/* "Solo questo gioco": la variante condivisa viene sdoppiata, il gioco corrente passa alla copia */
function forkVariant(vid, gid) {
  const o = DB.variants.find(v => v.id === vid), n = {id: uid(), cid: o.cid, name: o.name, games: [gid], u: now()};
  if (o.shape) n.shape = clone(o.shape);
  DB.variants.push(n);
  o.games = o.games.filter(x => x !== gid);
  const {groups, cars} = gameKeys(gid);
  const mv = (obj, test, toKey) => Object.keys(obj).forEach(k => { if (test(k)) { obj[toKey(k)] = obj[k]; delete obj[k]; } });
  mv(DB.brakes, k => k.startsWith(vid + '|') && groups.has(k.slice(vid.length + 1)), k => n.id + k.slice(vid.length));
  mv(DB.pits, k => k.startsWith(vid + '|') && groups.has(k.slice(vid.length + 1)), k => n.id + k.slice(vid.length));
  const carKey = k => k.endsWith('|' + vid) && cars.has(k.slice(0, k.length - vid.length - 1));

function engCond() { return UI.engCond || 'dry'; }
function engAxle(sub, label) {
  const s = (sub || '').toLowerCase(), l = (label || '').toLowerCase();
  if (/^ant/.test(s)) return 'F'; if (/^post/.test(s)) return 'R';
  if (/\bant(\.|eriore|\b)/.test(l)) return 'F'; if (/\bpost/.test(l)) return 'R';
  return null;
}
function engAll() {   // tutti i parametri dell'auto, con asse e sezione
  const out = [];
  carSections().forEach(sec => {
    const add = (p, sub) => out.push({id: p.id, label: p.label, sec: sec.name || '', sub: sub || '', ax: engAxle(sub, p.label)});
    sec.params.forEach(p => add(p, '')); (sec.subs || []).forEach(b => b.params.forEach(p => add(p, b.name)));
  });
  return out;
}
function engIds(key, all) {
  const K = ENG_KEYS[key];
  return (all || engAll()).filter(p => K.lab.test(p.label.toLowerCase()) && (!K.sec || K.sec.test(p.sec.toLowerCase())) && (!K.ax || p.ax === K.ax)).map(p => p.id);
}
function engParse(v) { const m = String(v ?? '').trim().match(/^(-?\d+(?:[.,]\d+)?)(.*)$/); if (!m) return null; return {n: parseFloat(m[1].replace(',', '.')), dec: (m[1].split(/[.,]/)[1] || '').length, comma: /,/.test(m[1]), suf: m[2]}; }

const engDec = st => { const m = String(st).match(/\.(\d+)/); return m ? m[1].length : 0; };
function engMove(val, st, d) {   // valore spostato di un passo, con lo stesso formato dell'originale
  const o = engParse(val); if (!o || st == null) return null;
  return engFmt(o, o.n + d * st, Math.max(o.dec, engDec(st)));
}
function engFix(fix, all, snap) {   // cosa cambiare per questa proposta: per ogni parametro valore attuale e proposto
  const K = ENG_KEYS[fix.k], ids = engIds(fix.k, all);
  if (!ids.length) return null;
  const rows = ids.map(id => { const cur = snap[id]; return {id, cur: cur == null ? '' : String(cur), to: engMove(cur, K.st, fix.d)}; });
  return {k: fix.k, n: K.n, st: K.st, d: fix.d, w: fix.w, r: fix.r, rows};
}
function engSummary(f) {   // "−0,1 → −0,3" oppure "un passo più morbide"
  const same = f.rows.every(r => r.cur === f.rows[0].cur && r.to === f.rows[0].to);
  if (f.rows.every(r => r.to != null)) return same ? f.rows[0].cur + ' → ' + f.rows[0].to : (f.rows.length + ' valori: ' + (f.d > 0 ? '+' : '−') + String(f.st).replace('.', ',') + ' ciascuno');

/* ===================================================================
   STRATEGIA GARA (replica l'ACC Strategist, verificata su 4 gare)
   =================================================================== */
const numP = s => { const v = parseFloat(String(s).replace(',', '.')); return isNaN(v) ? null : v; };
function paceP(s) {
  s = normTime(String(s)).trim().replace(',', '.');
  const m = s.match(/^(\d+):(\d+(?:\.\d+)?)$/);
  if (m) return Math.round((parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000) / 1000;
  const v = parseFloat(s); return isNaN(v) ? null : Math.round(v * 1000) / 1000;
}
const fPace = x => { const m = Math.floor(x / 60), r = x - m * 60; let sec = r.toFixed(3); if (r < 10) sec = '0' + sec; return m + ':' + sec; };
const fDur = x => { x = Math.round(x); const h = Math.floor(x / 3600), m = Math.floor((x % 3600) / 60), s = x % 60; return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s; };
const fMS = x => { x = Math.round(x); const m = Math.floor(x / 60), s = x % 60; return m + ':' + (s < 10 ? '0' : '') + s; };
const ceilEps = x => Math.ceil(x - 1e-9);
function rte(x) { const f = Math.floor(x), d = x - f; if (d > 0.5) return f + 1; if (d < 0.5) return f; return f % 2 === 0 ? f : f + 1; } // arrotonda come il Strategist: la metà va al pari
function maxFuel(r, P) { const mL = P.mgu === 'giri' ? P.mg * P.cons : P.mg; return Math.max(...r.fuel.map((f, i) => i > 0 ? f + mL : f)); }

function stratPlan(P, stops) {
  const avail = P.D - stops * P.pit;
  let n = ceilEps(avail / P.pace); if (n < 1) n = 1;
  const low = avail / n, high = n > 1 ? avail / (n - 1) : null, s = stops + 1, full = P.form === 'full', tot = n + (full ? 1 : 0);
  const base = Math.floor(tot / s), r = tot % s, st = [];
  for (let i = 0; i < s; i++) st.push(base + (i < r ? 1 : 0));
  const marginL = P.mgu === 'giri' ? P.mg * P.cons : P.mg, extra0 = P.form === 'short' ? 0.5 * P.cons : 0, fuel = [];
  if (P.refuel) { for (let i = 0; i < s; i++) fuel.push(ceilEps(st[i] * P.cons + (i === 0 ? extra0 + marginL : 0))); }
  else { fuel.push(ceilEps(tot * P.cons + extra0 + marginL)); for (let i = 1; i < s; i++) fuel.push(0); }
  const racing = st.slice(); if (full) racing[0] -= 1;
  let lap = 0; const pits = [];
  for (let i = 0; i < s - 1; i++) { lap += racing[i]; pits.push([lap, rte(P.D - (lap * P.pace + i * P.pit))]); }
  return {n, dur: Math.round(n * P.pace + stops * P.pit), low, high, st, racing, fuel, pits, stops};
}
function stratCalc(P) {
  const notes = [], maxLaps = P.ms ? Math.floor(P.ms / P.pace) : null;
  let res = null;
  for (let stops = P.mand; stops <= P.mand + 40; stops++) {
    const r = stratPlan(P, stops); let ok = true;
    if (maxLaps != null && Math.max(...r.racing) > maxLaps) ok = false;
    if (P.refuel && maxFuel(r, P) > P.tank) ok = false;
    if (ok) { res = r; break; }
  }
  if (!res) { res = stratPlan(P, P.mand); notes.push('Nessun numero di soste rispetta i limiti inseriti: controlla serbatoio e durata massima stint.'); }
  else if (res.stops > P.mand) {
    const why = [], r0 = stratPlan(P, P.mand);
    if (maxLaps != null && Math.max(...r0.racing) > maxLaps) why.push('la durata massima stint');
    if (P.refuel && maxFuel(r0, P) > P.tank) why.push('il serbatoio');
    notes.push('Servono ' + res.stops + ' soste invece di ' + P.mand + ': ' + (why.join(' e ') || 'i limiti') + '.');
  }
  if (!P.refuel && res.fuel[0] > P.tank) notes.push('Senza rifornimento servono ' + res.fuel[0] + ' L alla partenza, più del serbatoio (' + P.tank + ' L). Questa gara non si può fare senza rifornire.');
  return {r: res, notes};
}
function openStrat() {
  if (!needCtx('av')) return;
  const perf = DB.perf[kk(A.id, V.id)], pk = kk(V.id, G.id);
  let pt = DB.pits[pk] || {s: 60, st: 'predefinito'};

    : 'Per questa auto su questo circuito mancano passo e consumo. Inseriscili qui sotto o salvali in Dati rapidi.';
  const pstText = dirty => '<b>' + (dirty ? 'Non salvato' : pt.st.charAt(0).toUpperCase() + pt.st.slice(1)) + '</b> · ' + esc(G.name) + ' · ' + esc(varName()) + (!dirty && pt.st === 'copiato' && pt.from ? ' (da ' + esc(pt.from) + ')' : '');
  sheet('Strategia gara', `<p class="meta">${esc(info)}</p><div class="zg">
      <div class="f">Durata gara<div style="display:flex;gap:6px;align-items:center"><input id="zdurh" inputmode="numeric" value="1" aria-label="Ore" style="min-width:0"><span>h</span><input id="zdurm" inputmode="numeric" value="0" aria-label="Minuti" style="min-width:0"><span>min</span></div></div>
      <label class="f">Passo gara<input id="zpace" value="${esc(perf ? perf.paceD : '')}" placeholder="m:ss.mmm"></label>

      <div class="full z2"><span id="zpst"></span><button class="sec2" id="zsave" type="button">Salva per questa pista</button></div>
      <label class="f">Giro di formazione<select id="zform"><option value="none">Nessuno</option><option value="full">Completo</option><option value="short">Breve</option></select></label>
      <label class="f">Rifornimento<select id="zref"><option value="1">Consentito</option><option value="0">Non consentito</option></select></label>
      <div class="full z2"><label class="zc"><input type="checkbox" id="zmsOn"> Durata massima stint</label><label class="f zf dis" id="zmsw">Minuti<input id="zms" inputmode="decimal" value="45" disabled></label></div>
      <div class="full z2"><label class="f">Margine<input id="zmg" inputmode="decimal" value="0"></label><label class="f">Unità<select id="zmgu"><option value="giri">Giri</option><option value="litri">Litri</option></select></label></div>
    </div><div id="zout"></div>`, carNameFull());
  const zr = () => {
    const g = id => $(id).value;
    const dh = numP(g('zdurh') || '0'), dm = numP(g('zdurm') || '0'), D = dh == null || dm == null ? null : dh * 60 + dm, pace = paceP(g('zpace')), cons = numP(g('zcons')), pit = numP(g('zpit')), mand = numP(g('zmand')), tk = numP(g('ztank')), mg = numP(g('zmg'));

      <div class="tile"><div class="k">Durata stimata</div><div class="v">${fDur(r.dur)}</div><div class="s">${r.stops}${r.stops === 1 ? ' sosta' : ' soste'}</div></div></div><div class="rows">`;
    r.st.forEach((laps, i) => {

function gameAction(act, btn) {
  const id = UI.ec.id;
  if (act === 'cancel') return closeSheet();
  if (act === 'save') {
    const name = $('mN').value.trim();
    if (!name) return toast('Scrivi il nome del gioco');
    if (DB.games.some(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== id)) return toast('Esiste gi\u00e0 un gioco con questo nome');
    if (id) DB.games.find(x => x.id === id).name = name;
    else { const g = {id: uid(), name}; DB.games.push(g); DB.settings.sel = {game: g.id}; resetMapState(); }
    save(); closeSheet(); render(); return toast('Gioco salvato');
  }
  if (act === 'del') {
    if (DB.groups.some(g => g.gameId === id)) return toast('Prima elimina i gruppi auto di questo gioco');
    if (!armed(btn, 'Conferma eliminazione')) return;
    DB.variants.filter(v => v.games.includes(id)).forEach(v => { detachVariantFromGame(v, id); if (!v.games.length) removeVariant(v.id); });
    DB.circuits = DB.circuits.filter(c => DB.variants.some(v => v.cid === c.id));
    DB.games = DB.games.filter(x => x.id !== id); DB.settings.sel = {};
    save(); closeSheet(); render(); toast('Gioco eliminato');
  }
}

/* --- Catalogo di piste già disegnate (file catalogo-acc.json) --- */
const norm = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const hasShape = v => !!(v && v.shape && v.shape.pts && v.shape.pts.length > 2);
function catMatch(e) {                                   // la variante di questo gioco che sembra essere quella del catalogo
  for (const c of gCircuits()) {
    const n = norm(c.name);
    if (!e.keys.some(k => n.includes(k) || (n.length >= 3 && k.includes(n)))) continue;
    const vs = gVariants(c.id); if (vs.length) return vs.find(v => norm(v.name).includes('gp')) || vs[0];
  }
  return null;
}
function openCatalog() {
  sheet('Catalogo piste', '<p class="meta">Carico il catalogo...</p>', 'Gioco: ' + GAME.name);
  fetch('catalogo-acc.json').then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(cat => {
    UI.cat = cat;
    const all = gVariants().map(v => ({v, label: ((DB.circuits.find(c => c.id === v.cid) || {}).name || '') + ' ' + v.name}));
    const rows = cat.circuits.map((e, i) => {
      const m = catMatch(e), old = m && hasShape(m) && m.shape.cv && m.shape.cv < (e.sv || cat.v), ren = m && e.rename && m.name !== e.variant, def = m ? (hasShape(m) && !old && !ren ? 'skip' : m.id) : 'new';
      return `<div class="f2"><span><b>${esc(e.name)}</b> \u00b7 ${esc(e.variant)}</span><select data-cat="${i}"><option value="skip"${def === 'skip' ? ' selected' : ''}>Non toccare</option><option value="new"${def === 'new' ? ' selected' : ''}>Crea nuova pista</option>${all.map(o => `<option value="${o.v.id}"${def === o.v.id ? ' selected' : ''}>Disegna su: ${esc(o.label)}${hasShape(o.v) ? ' (sostituisce il disegno)' : ''}${def === o.v.id && hasShape(o.v) ? ' \u00b7 versione pi\u00f9 pulita' : ''}</option>`).join('')}</select></div>`;
    }).join('');
    sheet('Catalogo piste', `<p class="meta">Piste gi\u00e0 disegnate. Per ognuna ho scelto la pista che hai gi\u00e0 nell'app; puoi cambiarla. Le curve (numeri e nomi) restano come sono.</p><div style="margin-top:10px">${rows}</div>
      <div class="btns"><button class="pri" data-act="catapply">Applica</button><button class="sec2" data-act="close">Annulla</button></div>`, 'Gioco: ' + GAME.name);
  }).catch(() => sheet('Catalogo piste', '<div class="empty">Non riesco a caricare il catalogo. Controlla la connessione e riprova.</div>'));
}
function applyCatalog() {
  let n = 0;
  document.querySelectorAll('select[data-cat]').forEach(sel => {
    const e = UI.cat.circuits[+sel.dataset.cat], val = sel.value; if (val === 'skip') return;
    let v;
    if (val === 'new') {
      let c = DB.circuits.find(x => { const nn = norm(x.name); return e.keys.some(k => nn === k || nn.includes(k)); });
      if (!c) { c = {id: uid(), name: e.name, u: now()}; DB.circuits.push(c); }
      v = DB.variants.find(x => x.cid === c.id && x.name === e.variant);
      if (v) { if (!v.games.includes(GAME.id)) v.games.push(GAME.id); }
      else { v = {id: uid(), cid: c.id, name: e.variant, games: [GAME.id], u: now()}; DB.variants.push(v); }
    } else v = DB.variants.find(x => x.id === val);
    if (!v) return;
    if (e.rename && v.name !== e.variant) { v.name = e.variant; v.u = now(); n++; if (v.shape && v.shape.cv >= (e.sv || UI.cat.v)) return; }
    v.shape = {pts: clone(e.shape.pts), closed: e.shape.closed, h: e.shape.h, photo: (v.shape && v.shape.photo) || null, bg: v.shape && v.shape.bg, bgAr: v.shape && v.shape.bgAr, cv: e.sv || UI.cat.v, turns: ((v.shape && v.shape.turns) || []).map(t => ({id: t.id, n: t.n, u: now()}))};
    n++;
  });
  save(); closeSheet(); resetMapState(); render(); toast(n + (n === 1 ? ' pista disegnata' : ' piste disegnate'));
}

function parseOutline(text) {
  const out = []; let sec = null, cur = null;
  text.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
    if (l.startsWith('##')) { if (!sec) { sec = {id: uid(), name: 'Generale', params: [], subs: []}; out.push(sec); } cur = {id: uid(), name: l.replace(/^#+\s*/, ''), params: []}; sec.subs.push(cur); }
    else if (l[0] === '#') { sec = {id: uid(), name: l.replace(/^#+\s*/, ''), params: [], subs: []}; out.push(sec); cur = sec; }
    else { if (!cur) { sec = {id: uid(), name: 'Generale', params: [], subs: []}; out.push(sec); cur = sec; } cur.params.push({id: uid(), label: l}); }
  });
  return out;
}

/* trascinamento parametri nell'editor del gruppo (maniglia ⠿) */
(() => {
  let d = null;
  const clr = () => document.querySelectorAll('.dropt').forEach(e => e.classList.remove('dropt'));
  const target = (x, y) => {
    const el = document.elementFromPoint(x, y); if (!el) return null;
    const row = el.closest('.row2[data-pi]'); if (row && row !== d.row) return {row, el: row};
    const sub = el.closest('.sub'); if (sub) return {sub, el: sub};
    const sec = el.closest('.sec'); if (sec) return {sec, el: sec};
    return null;
  };
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest('.dh'); if (!h || !UI.eg) return;
    e.preventDefault(); const row = h.closest('.row2');
    d = {row, id: h.setPointerCapture ? e.pointerId : null, y0: e.clientY}; h.setPointerCapture(e.pointerId); row.classList.add('drag');
  });
  document.addEventListener('pointermove', e => {
    if (!d) return; d.row.style.transform = `translateY(${e.clientY - d.y0}px)`;
    clr(); d.row.style.pointerEvents = 'none'; const t = target(e.clientX, e.clientY); d.row.style.pointerEvents = ''; d.t = t; if (t) t.el.classList.add('dropt');
    const sh = document.querySelector('.sheet'), r = sh.getBoundingClientRect();
    if (e.clientY < r.top + 50) sh.scrollTop -= 12; else if (e.clientY > r.bottom - 50) sh.scrollTop += 12;
  });
  const end = e => {
    if (!d) return; const {row, t} = d; d = null; clr(); row.classList.remove('drag'); row.style.transform = '';
    if (!t || e.type === 'pointercancel') return;
    const g = UI.eg; collectGroup();
    const si = +row.dataset.si, pi = +row.dataset.pi, bi = row.dataset.bi == null ? -1 : +row.dataset.bi;
    const cont = (a, b) => b >= 0 ? g.sections[a].subs[b].params : g.sections[a].params;
    const [it] = cont(si, bi).splice(pi, 1);
    let ds, db, di;
    if (t.row) { ds = +t.row.dataset.si; db = t.row.dataset.bi == null ? -1 : +t.row.dataset.bi; di = +t.row.dataset.pi; const r = t.row.getBoundingClientRect(); if (e.clientY > r.top + r.height / 2) di++; if (ds === si && db === bi && pi < di) di--; }
    else if (t.sub) { const sc = t.sub.closest('.sec'); ds = [...document.querySelectorAll('.sec')].indexOf(sc); db = [...sc.querySelectorAll('.sub')].indexOf(t.sub); di = 0; }
    else { ds = [...document.querySelectorAll('.sec')].indexOf(t.sec); db = -1; di = cont(ds, -1).length; }
    cont(ds, db).splice(di, 0, it); redrawGroup();
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
})();
function groupAction(act, btn) {
  const g = UI.eg;
  if (act === 'cancel') { const r = UI.egRet; closeSheet(); return r ? setupBack(r) : null; }
  collectGroup();
  const si = +btn.dataset.si, pi = +btn.dataset.pi, bi = btn.dataset.bi == null ? -1 : +btn.dataset.bi;
  const tgt = () => bi >= 0 ? g.sections[si].subs[bi] : g.sections[si];
  if (act === 'mvsec' || act === 'mvsub') {
    const d = +btn.dataset.d, arr = act === 'mvsec' ? g.sections : g.sections[si].subs, i = act === 'mvsec' ? si : bi, j = i + d;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; return redrawGroup();
  }
  if (act === 'mvpar') {   // su/giù; oltre il bordo di un blocco il parametro passa al blocco vicino (libero ↔ sottosezioni)
    const sec = g.sections[si], conts = [sec.params].concat((sec.subs || []).map(b => b.params)), ci = bi + 1, arr = conts[ci], d = +btn.dataset.d, j = pi + d;
    if (j >= 0 && j < arr.length) [arr[pi], arr[j]] = [arr[j], arr[pi]];
    else { const nc = conts[ci + d]; if (!nc) return; const [it] = arr.splice(pi, 1); if (d < 0) nc.push(it); else nc.unshift(it); }
    return redrawGroup();
  }
  if (act === 'addsec') { const n = {id: uid(), name: '', params: [], subs: []}; g.sections.push(n); return redrawGroup(`.sec[data-sid="${n.id}"] .sn`); }
  if (act === 'addpar') {
    const np = {id: uid(), label: ''}; tgt().params.push(np);
    const sec = g.sections[si]; if (bi >= 0 && sec.link !== false && sec.subs.length > 1) sec.subs.forEach((b, k) => { if (k !== bi) b.params.push({id: uid(), label: ''}); });
    return redrawGroup(`.pn[data-pid="${np.id}"]`);
  }
  if (act === 'addsub') { const n = {id: uid(), name: '', params: []}; (g.sections[si].subs = g.sections[si].subs || []).push(n); return redrawGroup(`.sub[data-sid="${n.id}"] .subn`); }
  if (act === 'delsub') { g.sections[si].subs.splice(bi, 1); return redrawGroup(); }
  if (act === 'delsec') { g.sections.splice(si, 1); return redrawGroup(); }
  if (act === 'delpar') {
    const lab = (tgt().params[pi] || {label: ''}).label.trim().toLowerCase(); tgt().params.splice(pi, 1);
    const sec = g.sections[si]; if (bi >= 0 && lab && sec.link !== false && sec.subs.length > 1) sec.subs.forEach((b, k) => { if (k === bi) return; const x = b.params.findIndex(p => p.label.trim().toLowerCase() === lab); if (x >= 0) b.params.splice(x, 1); });
    return redrawGroup();
  }
  if (act === 'tpl') {
    const tp = tplFor((DB.games.find(x => x.id === g.gameId) || GAME).name); if (!tp) return;
    if (g.sections.some(x => x.params.length || (x.subs || []).length) && !armed(btn, 'Sostituisco i parametri attuali: conferma')) return;
    g.sections = parseOutline(tp.text); return redrawGroup();
  }
  if (act === 'paste') { $('pasteBox').hidden = !$('pasteBox').hidden; return; }
  if (act === 'pasteadd') {
    $('pasteBox').hidden = true;
    let cur = g.sections[g.sections.length - 1];
    $('pasteTx').value.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      if (l.startsWith('##')) { const sec = g.sections[g.sections.length - 1] || (g.sections.push({id: uid(), name: 'Generale', params: [], subs: []}), g.sections[0]); sec.subs = sec.subs || []; cur = {id: uid(), name: l.replace(/^#+\s*/, ''), params: []}; sec.subs.push(cur); }
      else if (l[0] === '#') { cur = {id: uid(), name: l.replace(/^#+\s*/, ''), params: [], subs: []}; g.sections.push(cur); }
      else { if (!cur) { cur = {id: uid(), name: 'Generale', params: [], subs: []}; g.sections.push(cur); } cur.params.push({id: uid(), label: l}); }
    });
    return redrawGroup();
  }
  if (act === 'save') {
    if (!g.name) return toast('Scrivi il nome del gruppo');
    g.sections = g.sections.map(s => ({...s, params: s.params.filter(p => p.label), subs: (s.subs || []).map(b => ({...b, name: b.name || 'Sottosezione', params: b.params.filter(p => p.label)})).filter(b => b.params.length)})).filter(s => s.name || s.params.length || s.subs.length);
    g.sections.forEach(s => { if (!s.name) s.name = 'Generale'; });
    g.u = now();
    const i = DB.groups.findIndex(x => x.id === g.id);
    if (i >= 0) DB.groups[i] = g; else { g.id = uid(); DB.groups.push(g); DB.settings.sel.g = g.id; DB.settings.sel.a = null; }
    const r = UI.egRet; save(); closeSheet(); render(); toast('Gruppo salvato'); return r ? setupBack(r) : null;
  }
  if (act === 'del') {
    const n = DB.cars.filter(a => a.gid === g.id).length;
    if (!armed(btn, n ? `Conferma: elimina gruppo e ${n} auto` : 'Conferma eliminazione')) return;
    DB.cars.filter(a => a.gid === g.id).forEach(a => removeCar(a.id));
    removeGroupData(g.id);
    DB.groups = DB.groups.filter(x => x.id !== g.id);
    save(); closeSheet(); render(); toast('Gruppo eliminato');
  }
}

function circuitAction(act, btn) {
  const e = UI.ec;
  if (act === 'cancel') return closeSheet();
  collectCircuit();
  if (act === 'addvar') { e.vs.push({id: uid(), name: '', isNew: true, from: '', games: [GAME.id]}); return drawCircuit(e.name); }
  if (act === 'delvar') {
    const v = e.vs[+btn.dataset.i];
    if (!v.isNew && !armed(btn, 'Conferma: cancella anche i dati')) return;
    e.vs.splice(+btn.dataset.i, 1); return drawCircuit(e.name);
  }
  if (act === 'save') {
    const vs = e.vs.filter(v => v.name);
    if (!e.name) return toast('Scrivi il nome del circuito');
    if (!vs.length) return toast('Aggiungi almeno una variante');
    if (vs.some(v => !v.games.length)) return toast('Ogni variante deve esistere in almeno un gioco');
    const lost = [];
    vs.forEach(v => { const old = DB.variants.find(x => x.id === v.id); if (old) old.games.filter(g => !v.games.includes(g)).forEach(g => { if (variantHasData(old.id, g)) lost.push(g); }); });
    if (lost.length && !armed(btn, 'Conferma: cancella i dati in ' + [...new Set(lost)].map(gameName).join(', '))) return;
    let c = e.id ? DB.circuits.find(x => x.id === e.id) : null;
    const isNewC = !c; if (!c) { c = {id: uid()}; DB.circuits.push(c); }
    c.name = e.name; c.u = now();
    const keep = new Set(vs.map(v => v.id));
    DB.variants.filter(v => v.cid === c.id && !keep.has(v.id)).forEach(v => removeVariant(v.id));
    vs.forEach(v => {
      const old = DB.variants.find(x => x.id === v.id);
      if (old) { old.games.filter(g => !v.games.includes(g)).forEach(g => detachVariantFromGame(old, g)); old.games = v.games.slice(); old.name = v.name; old.u = now(); }
      else { DB.variants.push({id: v.id, cid: c.id, name: v.name, games: v.games.slice(), u: now()}); if (v.from) copyVariantData(v.from, v.id); }
    });
    if (isNewC) { DB.settings.sel.c = c.id; DB.settings.sel.v = vs[0].id; resetMapState(); }
    save(); closeSheet(); render(); return toast('Circuito salvato');
  }
  if (act === 'del') {
    if (!armed(btn, 'Conferma: cancella anche i dati')) return;
    DB.variants.filter(v => v.cid === e.id).forEach(v => removeVariant(v.id));
    DB.circuits = DB.circuits.filter(x => x.id !== e.id);
    save(); closeSheet(); render(); toast('Circuito eliminato');
  }
}

  if (UI.eg && t.dataset && t.dataset.mvto) {   // sposta un parametro in un'altra sezione o sottosezione
    if (!t.value) return;
    collectGroup(); const g = UI.eg, si = +t.dataset.si, bi = t.dataset.bi == null ? -1 : +t.dataset.bi, pi = +t.dataset.pi, [ds, db] = t.value.split(':').map(Number);
    const src = bi < 0 ? g.sections[si].params : g.sections[si].subs[bi].params, dst = db < 0 ? g.sections[ds].params : g.sections[ds].subs[db].params;
    const [it] = src.splice(pi, 1); dst.push(it); return redrawGroup();
  }
  if (UI.eg && t.classList && t.classList.contains('pn') && t.closest('.sub')) {   // rinomina collegata nelle sottosezioni
    const g = UI.eg; let old = null, secI = -1, subI = -1;
    g.sections.forEach((s, si) => (s.subs || []).forEach((b, bi) => b.params.forEach(p => { if (p.id === t.dataset.pid) { old = p.label; secI = si; subI = bi; } })));
    collectGroup();
    const sec = g.sections[secI];
    if (old !== null && sec && sec.link !== false && (sec.subs || []).length > 1) {
      const nv = t.value.trim(); let n = 0;
      sec.subs.forEach((b, bi) => { if (bi === subI) return; const q = b.params.find(p => p.label.trim().toLowerCase() === old.trim().toLowerCase()); if (q && q.label !== nv) { q.label = nv; n++; } });
      if (n) { redrawGroup(); toast('Rinominato in ' + (n + 1) + ' sottosezioni'); }
    }
    return;
  }
  if (t.id === 'bgIn' && t.files[0]) { loadBg(t.files[0]); t.value = ''; return; }
  if (t.id === 'bgO') { save(); return; }
  if (t.id === 'trkS') { bakeTrk(); drawMap(); return; }
  if (t.id === 'fileIn' && t.files[0]) { readBackupFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'photoIn' && t.files[0]) { loadPhoto(t.files[0]); t.value = ''; return; }
  if (t.dataset.sel && t.value === '__new__') {
    const k = t.dataset.sel; render();
    if (k === 'game') return editGame();
    if (k === 'c') return editCircuit();
    if (k === 'g') return editGroup();
    if (k === 'a') return editCar();
    if (k === 'v') { if (!C) return editCircuit(); editCircuit(C.id); UI.ec.vs.push({id: uid(), name: '', isNew: true, from: '', games: [GAME.id]}); return drawCircuit(C.name); }
  }
  if (t.dataset.sel) {
    const s = DB.settings.sel; s[t.dataset.sel] = t.value;
    if (t.dataset.sel === 'c') s.v = null;
    if (t.dataset.sel === 'g') s.a = null;
    if (t.dataset.sel === 'game') { s.c = s.v = s.g = s.a = null; }
    if (t.dataset.sel === 'c' || t.dataset.sel === 'v' || t.dataset.sel === 'game') resetMapState();
    save(); render(); return;
  }
  if ('scope' in t.dataset) { UI.scope = t.value; drawMap(); return; }
  if (t.dataset.cp) {
    DB.settings.copies[t.dataset.cp] = t.dataset.cp === 'keep' ? +t.value : t.value;
    save(); pruneCopies().then(fillCopies);
  }
});
document.addEventListener('input', e => { if (e.target.id === 'drTol' && UI.dr) { UI.dr.tol = +e.target.value; runAuto(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('layer').firstChild) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.turn) { e.preventDefault(); pickTurn(e.target.dataset.turn); }
});

/* ===================================================================
   AVVIO
   =================================================================== */
function start() {
  $('ver').textContent = 'v' + APP_V;
  openArchive().then(db => { idb = db; return tx('kv', 'readonly', s => s.get('db')); })
    .catch(() => { memOnly = true; showNotice('Il browser non permette di salvare i dati (navigazione privata?). Apri Simapex in una finestra normale.'); return null; })
    .then(txt => {
      if (txt) {
        const d = JSON.parse(txt);
        DB = valid(d) ? migrate(d) : newDB();
        if (!valid(d)) showNotice('I dati salvati non erano leggibili: riparti da zero oppure ripristina un backup.');
        else if (d.v !== DATA_V) save();
      } else DB = newDB();
      DB.settings.copies = DB.settings.copies || {every:'day', keep:5};
      render();
      if (syncOn()) syncStart(false);
      if (idb) maybeCopy();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(p => { UI.persisted = p; if (UI.tab === 'backup') render(); });
    });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (had) $('notice').innerHTML = '<div class="banner" style="margin-bottom:12px"><span>Nuova versione pronta.</span><button class="sec2" onclick="location.reload()">Ricarica</button></div>';
    });
  }
}
start();
</script>
